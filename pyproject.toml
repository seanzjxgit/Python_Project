[project]
name = "build_test"
version = "0.1.0"
dependencies = [
    "flask>=3.1.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Python_Project"]

[dependency-groups]
dev = [
    "build>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
